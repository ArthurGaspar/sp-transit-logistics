name: Collect live bus speeds

# Samples Olho Vivo bus positions and appends per-hexagon hourly speed aggregates
# to the `realtime-data` branch. Does nothing until the OLHOVIVO_TOKEN secret exists.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-realtime
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.OLHOVIVO_TOKEN != '' }}
    steps:
      - name: Skip without token
        if: env.HAS_TOKEN != 'true'
        run: echo "OLHOVIVO_TOKEN is not configured; nothing to do."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: env.HAS_TOKEN == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Check out the data branch
        if: env.HAS_TOKEN == 'true'
        run: |
          if git ls-remote --exit-code --heads origin realtime-data > /dev/null; then
            git fetch --depth=1 origin realtime-data
            git worktree add store FETCH_HEAD
          else
            git worktree add --detach store
            git -C store checkout --orphan realtime-data
            git -C store rm -rf --quiet .
          fi

      - name: Collect
        if: env.HAS_TOKEN == 'true'
        env:
          OLHOVIVO_TOKEN: ${{ secrets.OLHOVIVO_TOKEN }}
          REALTIME_DIR: ${{ github.workspace }}/store/realtime
        run: python pipeline/collect_realtime.py

      - name: Commit aggregates
        if: env.HAS_TOKEN == 'true'
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realtime
          git diff --cached --quiet && exit 0
          git commit -m "Realtime speeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:realtime-data
